<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Puzzle piece -->
  <path d="M 30 30 
           L 55 30 
           C 55 22, 65 22, 65 30 
           L 90 30 
           L 90 55 
           C 98 55, 98 65, 90 65 
           L 90 90 
           L 65 90 
           C 65 98, 55 98, 55 90 
           L 30 90 
           Z" 
        stroke="url(#g)" stroke-width="4" fill="none" stroke-linejoin="round"/>

  <!-- Inner dots = players -->
  <circle cx="48" cy="48" r="4" fill="url(#g)"/>
  <circle cx="72" cy="72" r="4" fill="url(#g)"/>
  <line x1="48" y1="48" x2="72" y2="72" stroke="url(#g)" stroke-width="2" stroke-dasharray="3 3"/>
</svg>